<div id="preferences-panel" class="preferences-panel">
  <h3>Your Preferences</h3>
  <!-- Progress bar container -->
  <div id="progress-container" style="margin-bottom:10px;">
    <div id="progress-bar-bg" style="background:#eee;width:100%;height:14px;border-radius:8px;overflow:hidden;">
      <div id="progress-bar-fill" style="background:#40d080;width:0;height:100%;transition:width 0.5s;"></div>
    </div>
    <div id="progress-label" style="text-align:center;font-size:13px;margin-top:2px;color:#333;">Preferences: 0/4 filled</div>
  </div>
  <ul>
    <li><strong>Genre:</strong> <span id="pref-genre">—</span></li>
    <li><strong>Mood:</strong> <span id="pref-mood">—</span></li>
    <li><strong>Tempo:</strong> <span id="pref-tempo">—</span></li>
    <li><strong>Artist/Song:</strong> <span id="pref-artist">—</span></li>
  </ul>
</div>
